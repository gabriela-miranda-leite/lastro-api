version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/gabriela-miranda-leite/lastro-api

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - noctx
    - bodyclose
    - contextcheck
    - exhaustive
    - godot
    - nilerr
    - nilnil
    - wrapcheck
    - forbidigo

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    misspell:
      locale: US

    forbidigo:
      forbid:
        - pattern: "^fmt\\.Print"
          msg: "use structured logging (slog) instead of fmt.Print"
        - pattern: "^log\\.Print"
          msg: "use structured logging (slog) instead of log.Print"
        - pattern: "^time\\.Sleep"
          msg: "time.Sleep is not allowed in production code"
        - pattern: "^panic"
          msg: "panic is not allowed outside of main.go"

    wrapcheck:
      ignorePackageGlobs:
        - "github.com/gabriela-miranda-leite/lastro-api/*"

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - unused
        - wrapcheck
        - godot

    - path: "cmd/api/main\\.go"
      linters:
        - forbidigo

    - path: "docs/.*\\.go"
      linters:
        - godot

  max-issues-per-linter: 0
  max-same-issues: 0
