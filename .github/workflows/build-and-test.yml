name: Build & Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lastro_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

      - name: Build
        run: go build ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/lastro_test?sslmode=disable
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Coverage summary
        id: coverage
        run: |
          go tool cover -func=coverage.out | tail -1

          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          TOTAL_NUM=$(echo "$TOTAL" | tr -d '%')
          if awk "BEGIN{exit !($TOTAL_NUM+0 < 75)}"; then
            echo "FAIL: global coverage $TOTAL is below 75%"
            exit 1
          fi
          echo "Coverage OK: $TOTAL (threshold 75%)"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          # build per-package table (exclude test helpers and main)
          TABLE=$(go tool cover -func=coverage.out \
            | grep -v "_test\.go" \
            | grep "^github\.com" \
            | grep -v "/testhelpers/" \
            | grep -v "cmd/api/main\.go" \
            | awk '
              /[0-9]+\.[0-9]+%$/ {
                pkg = $1
                pct = $3
                sub(/github\.com\/gabriela-miranda-leite\/lastro-api\//, "", pkg)
                sub(/:[^:]+$/, "", pkg)
                pkgs[pkg] = pct
              }
              END {
                for (p in pkgs) print p "\t" pkgs[p]
              }' \
            | sort)
          echo "table<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TABLE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.coverage.outputs.total }}';
            const rawTable = `${{ steps.coverage.outputs.table }}`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const pct = parseFloat(total);
            const badge = pct >= 80 ? '🟢' : pct >= 50 ? '🟡' : '🔴';

            const rows = rawTable.trim().split('\n').filter(Boolean).map(line => {
              const [pkg, p] = line.split('\t');
              const v = parseFloat(p);
              const icon = v >= 80 ? '🟢' : v >= 50 ? '🟡' : v > 0 ? '🔴' : '⚫';
              return `| \`${pkg}\` | ${icon} ${p} |`;
            }).join('\n');

            const body = [
              `## ${badge} Coverage report — ${total}`,
              '',
              `> commit [\`${sha}\`](${context.payload.pull_request.head.repo.html_url}/commit/${context.payload.pull_request.head.sha})`,
              '',
              '| Pacote | Cobertura |',
              '|--------|-----------|',
              rows,
              '',
              '_🟢 ≥ 80% · 🟡 ≥ 50% · 🔴 < 50% · ⚫ sem testes_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Coverage report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

